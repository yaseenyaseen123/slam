<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بصمات الزوار - سلام حمود</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; }
  </style>
</head>
<body class="bg-royal-900 text-white min-h-screen">
  <nav class="bg-royal-900/90 sticky top-0 z-50 border-b border-white/10 backdrop-blur-md">
    <div class="container mx-auto px-6 py-4 flex flex-wrap items-center justify-between gap-4">
      <a href="./index.html" class="text-2xl font-black text-gold-500">SALAM</a>
      <div class="flex flex-wrap gap-3 text-sm md:text-base">
        <a href="./index.html" class="hover:text-gold-500">الرئيسية</a>
        <a href="./gallery.html" class="hover:text-gold-500">المعرض</a>
        <a href="./videos.html" class="hover:text-gold-500">الفيديوهات</a>
        <a href="./social.html" class="hover:text-gold-500">تواصل معي</a>
        <a href="./guestbook.html" class="hover:text-gold-500">بصمات الزوار</a>
        <a href="./admin.html" class="hover:text-gold-500">لوحة التحكم</a>
      </div>
    </div>
  </nav>

  <main class="container mx-auto px-6 py-12">
    <div class="mb-10 text-center">
      <h1 class="text-3xl md:text-5xl font-black text-gold-500">بصمات الزوار</h1>
      <div class="mx-auto mt-4 h-1 w-24 rounded bg-gold-500"></div>
    </div>

    <form id="guestbook-form" class="mx-auto mb-10 max-w-2xl rounded-2xl border border-white/10 bg-white/5 p-6 shadow-lg">
      <div class="mb-5">
        <label class="mb-2 block text-sm font-bold text-gold-500">الاسم</label>
        <input id="name" type="text" class="w-full rounded-xl border border-white/10 bg-transparent p-3 text-white outline-none focus:border-gold-500" placeholder="اكتب اسمك" required />
      </div>
      <div class="mb-5">
        <label class="mb-2 block text-sm font-bold text-gold-500">الرسالة</label>
        <textarea id="message" class="h-32 w-full rounded-xl border border-white/10 bg-transparent p-3 text-white outline-none focus:border-gold-500" placeholder="اكتب رسالتك هنا" required></textarea>
      </div>
      <button type="submit" class="w-full rounded-xl bg-gold-500 px-5 py-3 font-black text-royal-900 transition hover:bg-yellow-300">إرسال الرسالة</button>
    </form>

    <div id="guestbook-list" class="space-y-4"></div>
  </main>

  <script>
    const STORAGE_KEY = 'slam-guestbook';

    function loadGuestbook() {
      let entries = [];
      try {
        entries = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      } catch (error) {
        entries = [];
      }

      const list = document.getElementById('guestbook-list');
      if (!Array.isArray(entries) || !entries.length) {
        list.innerHTML = '<div class="rounded-2xl border border-dashed border-white/20 p-6 text-center text-gray-300">لا توجد رسائل حتى الآن.</div>';
        return;
      }

      list.innerHTML = entries.slice().reverse().map(item => `
        <article class="rounded-2xl border border-white/10 bg-white/5 p-5 shadow-lg">
          <div class="mb-2 flex items-center justify-between gap-3">
            <h3 class="text-lg font-bold text-gold-500">${item.name || 'زائر'}</h3>
            <span class="text-xs text-gray-300">${item.date || 'اليوم'}</span>
          </div>
          <p class="text-gray-200 leading-8">${(item.message || '').replace(/\n/g, '<br>')}</p>
        </article>
      `).join('');
    }

    document.getElementById('guestbook-form').addEventListener('submit', function (event) {
      event.preventDefault();
      const name = document.getElementById('name').value.trim();
      const message = document.getElementById('message').value.trim();
      if (!name || !message) return;

      let entries = [];
      try {
        entries = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      } catch (error) {
        entries = [];
      }

      entries.push({
        name,
        message,
        date: new Date().toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' })
      });

      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
      this.reset();
      loadGuestbook();
    });

    loadGuestbook();
  </script>
</body>
</html>
