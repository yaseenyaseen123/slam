<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تواصل معي - سلام حمود</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; }
  </style>
</head>
<body class="bg-royal-900 text-white min-h-screen">
  <nav class="bg-royal-900/90 sticky top-0 z-50 border-b border-white/10 backdrop-blur-md">
    <div class="container mx-auto px-6 py-4 flex flex-wrap items-center justify-between gap-4">
      <a href="./index.html" class="text-2xl font-black text-gold-500">SALAM</a>
      <div class="flex flex-wrap gap-3 text-sm md:text-base">
        <a href="./index.html" class="hover:text-gold-500">الرئيسية</a>
        <a href="./gallery.html" class="hover:text-gold-500">المعرض</a>
        <a href="./videos.html" class="hover:text-gold-500">الفيديوهات</a>
        <a href="./social.html" class="hover:text-gold-500">تواصل معي</a>
        <a href="./guestbook.html" class="hover:text-gold-500">بصمات الزوار</a>
        <a href="./admin.html" class="hover:text-gold-500">لوحة التحكم</a>
      </div>
    </div>
  </nav>

  <main class="container mx-auto px-6 py-12">
    <div class="mb-10 text-center">
      <h1 class="text-3xl md:text-5xl font-black text-gold-500">تواصل معي</h1>
      <div class="mx-auto mt-4 h-1 w-24 rounded bg-gold-500"></div>
    </div>
    <div id="social-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <script>
    const fallbackSocials = {
      instagram: 'https://instagram.com/salam_hammoud',
      twitter: 'https://twitter.com/SalamHam',
      facebook: 'https://facebook.com/Salam.Hammoud.Anchor',
      youtube: 'https://youtube.com/@salamhammoud9',
      tiktok: 'https://www.tiktok.com/@salam_hammoud',
      email: 'contact@salamhammoud.com'
    };

    async function loadSocials() {
      try {
        const response = await fetch('./data/data.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('failed');
        const data = await response.json();
        const socials = data.socials || fallbackSocials;
        renderSocials(socials);
      } catch (error) {
        console.error('Social load error:', error);
        renderSocials(fallbackSocials);
      }
    }

    function renderSocials(socials) {
      const grid = document.getElementById('social-grid');
      const list = [
        ['Instagram', socials.instagram, '📷'],
        ['TikTok', socials.tiktok, '🎵'],
        ['YouTube', socials.youtube, '▶️'],
        ['Facebook', socials.facebook, '👥'],
        ['Twitter', socials.twitter, '🐦'],
        ['البريد الإلكتروني', `mailto:${socials.email}`, '✉️']
      ].filter(([, href]) => !!href);

      grid.innerHTML = list.map(([label, href, icon]) => `
        <a href="${href}" target="_blank" rel="noreferrer" class="block rounded-2xl border border-white/10 bg-white/5 p-6 text-center transition hover:-translate-y-1 hover:bg-white/10">
          <div class="mb-3 text-4xl">${icon}</div>
          <h3 class="text-xl font-bold text-gold-500">${label}</h3>
        </a>
      `).join('');
    }

    loadSocials();
  </script>
</body>
</html>
