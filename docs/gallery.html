<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>معرض الصور - سلام حمود</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; }
  </style>
</head>
<body class="bg-royal-900 text-white min-h-screen">
  <nav class="bg-royal-900/90 sticky top-0 z-50 border-b border-white/10 backdrop-blur-md">
    <div class="container mx-auto px-6 py-4 flex flex-wrap items-center justify-between gap-4">
      <a href="./index.html" class="text-2xl font-black text-gold-500">SALAM</a>
      <div class="flex flex-wrap gap-3 text-sm md:text-base">
        <a href="./index.html" class="hover:text-gold-500">الرئيسية</a>
        <a href="./gallery.html" class="hover:text-gold-500">المعرض</a>
        <a href="./videos.html" class="hover:text-gold-500">الفيديوهات</a>
        <a href="./social.html" class="hover:text-gold-500">تواصل معي</a>
        <a href="./guestbook.html" class="hover:text-gold-500">بصمات الزوار</a>
        <a href="./admin.html" class="hover:text-gold-500">لوحة التحكم</a>
      </div>
    </div>
  </nav>

  <main class="container mx-auto px-6 py-12">
    <div class="mb-10 text-center">
      <h1 class="text-3xl md:text-5xl font-black text-gold-500">معرض الصور</h1>
      <div class="mx-auto mt-4 h-1 w-24 rounded bg-gold-500"></div>
    </div>
    <div id="gallery-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
  </main>

  <script>
    const fallbackImages = [
      'https://placehold.co/800x800/1e1b4b/d4af37?text=Event+1',
      'https://placehold.co/800x800/1e1b4b/d4af37?text=Studio',
      'https://placehold.co/800x800/1e1b4b/d4af37?text=Award',
      'https://placehold.co/800x800/1e1b4b/d4af37?text=Interview'
    ];

    async function loadGallery() {
      try {
        const response = await fetch('./data/data.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('failed');
        const data = await response.json();
        const images = Array.isArray(data.gallery) && data.gallery.length ? data.gallery : fallbackImages;
        renderGallery(images);
      } catch (error) {
        console.error('Gallery load error:', error);
        renderGallery(fallbackImages);
      }
    }

    function renderGallery(images) {
      const grid = document.getElementById('gallery-grid');
      grid.innerHTML = images.map(src => `
        <div class="group relative overflow-hidden rounded-xl border border-white/10 bg-white/5 shadow-lg">
          <img src="${src}" alt="صورة معرض" class="h-64 w-full object-cover transition-transform duration-500 group-hover:scale-110" />
          <div class="absolute inset-0 bg-black/30 opacity-0 transition-opacity duration-300 group-hover:opacity-100"></div>
        </div>
      `).join('');
    }

    loadGallery();
  </script>
</body>
</html>
