<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الفيديوهات - سلام حمود</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; }
  </style>
</head>
<body class="bg-royal-900 text-white min-h-screen">
  <nav class="bg-royal-900/90 sticky top-0 z-50 border-b border-white/10 backdrop-blur-md">
    <div class="container mx-auto px-6 py-4 flex flex-wrap items-center justify-between gap-4">
      <a href="./index.html" class="text-2xl font-black text-gold-500">SALAM</a>
      <div class="flex flex-wrap gap-3 text-sm md:text-base">
        <a href="./index.html" class="hover:text-gold-500">الرئيسية</a>
        <a href="./gallery.html" class="hover:text-gold-500">المعرض</a>
        <a href="./videos.html" class="hover:text-gold-500">الفيديوهات</a>
        <a href="./social.html" class="hover:text-gold-500">تواصل معي</a>
        <a href="./guestbook.html" class="hover:text-gold-500">بصمات الزوار</a>
        <a href="./admin.html" class="hover:text-gold-500">لوحة التحكم</a>
      </div>
    </div>
  </nav>

  <main class="container mx-auto px-6 py-12">
    <div class="mb-10 text-center">
      <h1 class="text-3xl md:text-5xl font-black text-gold-500">أحدث الفيديوهات</h1>
      <div class="mx-auto mt-4 h-1 w-24 rounded bg-gold-500"></div>
    </div>
    <div id="videos-grid" class="grid grid-cols-1 md:grid-cols-2 gap-8"></div>
  </main>

  <script>
    const fallbackVideos = [
      {
        title: 'أحدث حلقة من عالطريق',
        url: 'https://www.youtube.com/embed/dQw4w9WgXcQ',
        thumbnail: 'https://placehold.co/600x340/1e1b4b/d4af37?text=Video+1'
      },
      {
        title: 'مقابلة خاصة',
        url: 'https://www.youtube.com/embed/dQw4w9WgXcQ',
        thumbnail: 'https://placehold.co/600x340/1e1b4b/d4af37?text=Video+2'
      }
    ];

    async function loadVideos() {
      try {
        const response = await fetch('./data/data.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('failed');
        const data = await response.json();
        const videos = Array.isArray(data.videos) && data.videos.length ? data.videos : fallbackVideos;
        renderVideos(videos);
      } catch (error) {
        console.error('Videos load error:', error);
        renderVideos(fallbackVideos);
      }
    }

    function renderVideos(videos) {
      const grid = document.getElementById('videos-grid');
      grid.innerHTML = videos.map(video => `
        <article class="overflow-hidden rounded-2xl border border-white/10 bg-white/5 shadow-lg">
          <iframe class="h-72 w-full" src="${video.url}" title="${video.title}" allowfullscreen></iframe>
          <div class="p-5">
            <h3 class="text-xl font-bold text-gold-500">${video.title}</h3>
          </div>
        </article>
      `).join('');
    }

    loadVideos();
  </script>
</body>
</html>
